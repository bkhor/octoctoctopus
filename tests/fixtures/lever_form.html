<!doctype html>
<html>
<body>
<form>
  <div><input type="text" aria-label="Full Name" name="full_name" required></div>
  <div><textarea aria-label="Why do you want to work here?" name="motivation"></textarea></div>
  <div>
    <select aria-label="Preferred Location" name="location">
      <option value="remote">Remote</option>
      <option value="nyc">New York</option>
    </select>
  </div>
  <div><input type="checkbox" aria-label="Willing to relocate" name="relocate"></div>
  <div><input type="file" aria-label="Resume" name="resume"></div>
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
