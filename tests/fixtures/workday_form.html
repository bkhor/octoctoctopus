<!doctype html>
<html>
<body>
<form>
  <div>Full Name<input type="text" name="full_name" required></div>
  <div>Why do you want to work here?<textarea name="motivation"></textarea></div>
  <div>Preferred Location
    <select name="location">
      <option value="remote">Remote</option>
      <option value="nyc">New York</option>
    </select>
  </div>
  <div>Willing to relocate<input type="checkbox" name="relocate"></div>
  <div>Resume<input type="file" name="resume"></div>
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
