[project]
name = "octoctoctopus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
